<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F7FA">
<title>Packing Uva · Del campo al contenedor</title>
<meta name="description" content="Registros de calidad e inocuidad del packing de uva de mesa, de la recepción al embarque: a mano, por voz o con foto, sin señal y directo a Google Sheets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F5F7FA;--bg2:#EEF2F7;--card:#FFFFFF;--ink:#1F2937;--ink2:#374151;--mut:#6B7280;--line:#E5E9F0;--acc:#16A34A;--acc2:#7C3AED;--g1:linear-gradient(135deg,#22C55E,#10B981 45%,#06B6D4);--g2:linear-gradient(135deg,#8B5CF6,#EC4899);--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.serif{font-family:Inter,system-ui,sans-serif;font-weight:800;letter-spacing:-.03em}
.meta{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.meta i{width:6px;height:6px;border-radius:50%;background:var(--acc2);display:inline-block}
.kick{display:inline-block;font-size:12px;letter-spacing:.06em;color:#6D28D9;font-weight:700;background:#EDE9FE;padding:4px 10px;border-radius:999px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:transform .4s var(--ease),background .3s,color .3s,border-color .3s;cursor:pointer;white-space:nowrap}
.btn:hover{transform:translateY(-2px);border-color:var(--ink2)}
.btn.acc{background:var(--g1);color:#fff;border-color:transparent;box-shadow:0 3px 0 #0E8A4F,0 10px 22px -8px rgba(16,185,129,.6)}
.btn.acc:hover{filter:brightness(1.05);border-color:transparent}.btn.acc:active{transform:translateY(2px);box-shadow:0 1px 0 #0E8A4F}
.btn svg{width:17px;height:17px}
/* navegación en píldora */
.nav{position:fixed;top:20px;left:32px;padding-left:8px!important;z-index:40;display:flex;align-items:center;gap:4px;padding:6px 6px 6px 18px;border-radius:999px;background:rgba(251,248,242,.82);backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(221,210,192,.9);box-shadow:0 12px 30px -20px rgba(42,33,24,.45)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;margin-right:14px;letter-spacing:-.01em}
.logo .lm{width:34px;height:34px;border-radius:11px;background:var(--g2);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px -4px rgba(236,72,153,.5)}.logo svg{width:20px;height:20px}
.nav a.l{padding:8px 13px;border-radius:999px;font-size:14px;color:var(--ink2);transition:background .3s,color .3s}
.nav a.l:hover,.nav a.l.on{background:var(--bg2);color:var(--ink)}
.nav .btn{padding:9px 16px;font-size:14px;margin-left:6px}
/* recorrido */
#recorrido{position:relative;height:calc(7 * 115vh)}
.sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#world{position:absolute;inset:0}
#world canvas{display:block}
.fallback{position:absolute;inset:0}
.fallback img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s var(--ease)}
.fallback img.on{opacity:1}
.veil{display:none}
.stop{position:absolute;left:32px;bottom:8vh;width:min(540px,calc(100% - 64px));background:rgba(255,255,255,.9);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(229,233,240,.95);border-radius:24px;padding:24px 26px;box-shadow:0 24px 50px -28px rgba(16,24,40,.45);opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease),transform .9s var(--ease);pointer-events:none}
.stop.on{opacity:1;transform:none;pointer-events:auto}
.stop .meta{margin-bottom:12px}
.stop .kick{margin-bottom:12px;display:block}
.stop h2{font-size:clamp(28px,3.2vw,42px);line-height:1.15;margin:0 0 16px;text-wrap:balance}
.stop p{margin:0 0 10px;color:var(--ink2);font-size:16px;max-width:460px;text-wrap:pretty}
.stop small{display:block;color:var(--mut);font-size:13.5px;max-width:420px}
.stop.hero h1{font-size:clamp(36px,4.6vw,60px);line-height:1.18;margin:14px 0 14px;font-weight:800}.stop.hero h1 em{font-style:normal;background:var(--g1);-webkit-background-clip:text;background-clip:text;color:transparent}
.stop.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.big{font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.03em;font-size:46px;color:var(--acc);line-height:1;margin-top:14px;display:flex;align-items:baseline;gap:12px}
.big span{font-family:Inter,sans-serif;font-weight:500;letter-spacing:0;font-size:13px;color:var(--mut);line-height:1.3;max-width:150px}
.dots{position:absolute;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:18px;align-items:flex-end;z-index:5}
.dot{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;padding:0;font:inherit}
.dot b{font-weight:500;font-size:12.5px;color:var(--ink2);background:rgba(251,248,242,.9);border:1px solid var(--line);padding:4px 10px;border-radius:999px;opacity:0;transform:translateX(8px);transition:opacity .4s var(--ease),transform .5s var(--ease);white-space:nowrap}
.dot i{width:8px;height:8px;border-radius:50%;background:rgba(42,33,24,.25);transition:background .3s,transform .3s;flex:none}
.dot.on i{background:var(--acc);transform:scale(1.35)}
.dot.on b,.dot:hover b{opacity:1;transform:none}
.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .5s}
.hint span{width:1px;height:38px;background:var(--line);position:relative;overflow:hidden}
.hint span::after{content:"";position:absolute;left:0;top:-38px;width:1px;height:38px;background:var(--acc);animation:drop 1.8s var(--ease) infinite}
@keyframes drop{to{top:38px}}
/* frase que se ilumina */
.tagline{position:relative;padding:22vh 32px;display:grid;place-items:center;overflow:hidden}
.rings{position:absolute;left:50%;top:50%;width:min(1100px,160vw);aspect-ratio:1;transform:translate(-50%,-50%);color:var(--line);pointer-events:none}
.tagline p{position:relative;max-width:980px;margin:0;font-size:clamp(32px,4.4vw,62px);line-height:1.4;text-wrap:balance}
.tagline .w{color:rgba(42,33,24,.16);transition:color .4s}
.tagline .w.lit{color:var(--ink)}
.tagline .w.lit.a{color:var(--acc)}
/* secciones */
.sec{padding:120px 32px;max-width:1240px;margin:0 auto}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:46px}
.sh h2{font-size:clamp(36px,4.4vw,58px);line-height:1.08;margin:8px 0 0;text-wrap:balance}
.sh p{max-width:420px;color:var(--ink2);margin:0}
.rv{opacity:0;transform:translateY(30px);transition:opacity 1s var(--ease),transform 1.2s var(--ease)}
.rv.in{opacity:1;transform:none}
/* lista de registros estilo carta */
.carta{display:grid;grid-template-columns:1fr 1fr;gap:0 56px}
.grp{grid-column:1/-1;margin:34px 0 6px;display:flex;align-items:center;gap:12px}
.grp:first-child{margin-top:0}
.grp span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:700;white-space:nowrap}
.grp i{flex:1;height:1px;background:var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:18px 0;border-bottom:1px solid var(--line);cursor:default;transition:padding .4s var(--ease)}
.item:hover{padding-left:10px}
.item h3{margin:0;font-size:22px;line-height:1.25}
.item p{grid-column:1/2;margin:0;color:var(--mut);font-size:14px}
.item code{grid-row:1/3;grid-column:2;align-self:center;font-family:inherit;font-size:13px;color:var(--acc);border:1px solid #E7C9B6;border-radius:999px;padding:3px 10px;background:#FBEFE6}
.peek{position:fixed;z-index:30;width:220px;aspect-ratio:1;border-radius:120px 120px 18px 18px;overflow:hidden;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.85) rotate(-3deg);transition:opacity .3s,transform .5s var(--ease);box-shadow:0 30px 60px -30px rgba(42,33,24,.6);border:6px solid var(--card)}
.peek.on{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
.peek img{width:100%;height:100%;object-fit:cover}
/* formas de llenado */
.ways{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.way{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.way .ph{aspect-ratio:4/3;overflow:hidden;border-radius:160px 160px 0 0;margin:14px 14px 0;background:var(--bg2);display:grid;place-items:center;position:relative}
.way .ph svg.big{width:64px;height:64px;color:var(--acc)}
.way .bd{padding:20px 22px 24px}
.way h3{margin:0 0 6px;font-size:24px}
.way p{margin:0;color:var(--ink2);font-size:15px}
.wave{display:flex;gap:4px;align-items:center;height:40px;position:absolute;bottom:22px}
.wave i{width:4px;border-radius:3px;background:var(--acc);animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{height:6px}50%{height:36px}}
.scanl{position:absolute;left:12%;right:12%;height:2px;background:var(--acc2);box-shadow:0 0 18px 4px rgba(63,125,78,.35);animation:sc 2.8s var(--ease) infinite}
@keyframes sc{0%{top:22%}50%{top:74%}100%{top:22%}}
.paper{width:62%;height:62%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:9px;box-shadow:0 14px 30px -20px rgba(42,33,24,.5)}
.paper i{height:6px;border-radius:3px;background:var(--bg2)}
.hand{display:grid;grid-template-columns:repeat(3,48px);gap:8px}
.hand span{height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-weight:700;color:var(--ink2);transition:background .3s}
.hand span.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
/* pasos */
.steps{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start}
.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:26px}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:6px 14px}
.steps li b{font-family:"Hina Mincho",serif;font-size:34px;color:var(--acc);line-height:1;font-weight:400;grid-row:1/3}
.steps li h3{margin:2px 0 0;font-size:22px;font-weight:400;font-family:"Hina Mincho",serif}
.steps li p{margin:0;color:var(--ink2);font-size:15px}
.arch{border-radius:300px 300px 24px 24px;overflow:hidden;aspect-ratio:4/5;position:relative;border:8px solid var(--card);box-shadow:0 40px 80px -50px rgba(42,33,24,.6)}
.arch img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 1.4s var(--ease)}
.arch.in img{transform:none}
/* sheets */
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:16px;align-items:center}
.nd{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 20px;text-align:center}
.nd svg{width:34px;height:34px;color:var(--acc);margin-bottom:10px}
.nd h3{margin:0 0 4px;font-size:21px;font-weight:400;font-family:"Hina Mincho",serif}
.nd p{margin:0;color:var(--mut);font-size:14px}
.pipe{width:90px;height:2px;background:var(--line);position:relative;overflow:hidden}
.pipe::after{content:"";position:absolute;top:-2px;left:-30px;width:30px;height:6px;border-radius:3px;background:var(--acc);animation:pk 1.8s linear infinite}
@keyframes pk{to{left:90px}}
/* preguntas */
.faq{display:grid;grid-template-columns:1fr 1.4fr;gap:60px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;cursor:pointer;font-size:18px}
.faq summary::-webkit-details-marker{display:none}
.faq summary span{color:var(--acc);font-size:26px;line-height:1;transition:transform .5s var(--ease);font-weight:300}
.faq details[open] summary span{transform:rotate(45deg)}
.faq details p{margin:0 0 22px;color:var(--ink2);max-width:600px}
/* final */
.final{text-align:center;padding:140px 32px 120px;position:relative;overflow:hidden}
.final h2{font-size:clamp(44px,6vw,88px);line-height:1.04;margin:14px auto 22px;max-width:900px;text-wrap:balance}
.final p{color:var(--ink2);max-width:520px;margin:0 auto 30px;font-size:17px}
footer{border-top:1px solid var(--line);padding:34px 32px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:14px;max-width:1240px;margin:0 auto}
@media (max-width:900px){
 .nav{left:12px;right:12px;top:12px;justify-content:space-between}.nav a.l{display:none}
 .stop{left:12px;right:44px;bottom:12px;width:auto;padding:18px 18px;border-radius:20px}.stop.hero h1{font-size:32px}
 .stop p{font-size:15.5px}.stop small{display:none}.big{font-size:42px;margin-top:8px}
 .dots{right:12px;gap:14px}.dot b{display:none}
 .carta,.steps,.faq{grid-template-columns:1fr;gap:0 0}.steps{gap:40px}.faq{gap:10px}
 .ways{grid-template-columns:1fr}
 .flow{grid-template-columns:1fr;justify-items:stretch}.pipe{width:2px;height:40px;justify-self:center}.pipe::after{width:6px;height:20px;left:-2px;top:-20px;animation:pk2 1.6s linear infinite}
 @keyframes pk2{to{top:40px}}
 .sec{padding:90px 20px}.tagline{padding:16vh 20px}.final{padding:100px 20px 90px}
 .peek{display:none}
 .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.rv{opacity:1;transform:none}}
.stop .kick{display:inline-block!important}</style>
</head>

 </div>
